server {
    listen 80;
    root /usr/share/nginx/html;

    # API calls go to the FastAPI container. The name is resolved through Docker's DNS on every request
    # (cached 10 s): with a fixed "proxy_pass http://api:8000" nginx keeps the IP from its start and
    # returns 502 after the api container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        client_max_body_size 5g;          # confocal stacks can be several GB
        proxy_request_buffering off;       # stream uploads through instead of storing them in nginx first
    }

    # single-page app: unknown paths serve index.html
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
