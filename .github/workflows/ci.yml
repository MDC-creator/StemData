# Runs on every push: backend lint + tests, frontend type check + build.
name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-24.04
    container: python:3.12-slim-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          pip install -q https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/20240202/zeroc_ice-3.6.5-cp312-cp312-manylinux_2_28_x86_64.whl
          pip install -q -r backend/requirements/api.txt -r backend/requirements/dev.txt
      - name: Lint and test
        working-directory: backend
        run: |
          ruff check stemchub tests
          ruff format --check stemchub tests
          pytest

  frontend:
    runs-on: ubuntu-24.04
    container: node:22.23.3-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Type check and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
